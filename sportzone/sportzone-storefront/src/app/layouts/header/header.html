<header class="bg-white">
  <!-- Thanh trên cùng -->
  <div class="bg-indigo-100 text-xs font-medium text-blue-900">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-2">
      <span class="flex items-center gap-1.5">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Hotline: 1900 6868
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        Miễn phí vận chuyển toàn quốc cho đơn từ 500k
      </span>
    </div>
  </div>

  <!-- Hàng chính: logo, tìm kiếm, tài khoản -->
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-3 px-4 py-4">
    <a routerLink="/" class="leading-none">
      <p class="text-2xl font-extrabold tracking-tight text-blue-900">SPORTZONE</p>
      <p class="mt-0.5 text-[9px] font-extrabold tracking-wide text-amber-800">PERFORMANCE &amp; GEAR</p>
    </a>

    <div class="flex min-w-[260px] flex-1 items-center rounded-xl bg-indigo-50 p-1.5 lg:max-w-md">
      <input
        type="text"
        placeholder="Tất cả danh mục"
        class="min-w-0 flex-1 bg-transparent px-3 text-sm text-gray-700 outline-none placeholder:text-gray-500"
      />
      <span class="h-5 w-px bg-gray-300"></span>
      <svg class="mx-3 h-4 w-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <button class="whitespace-nowrap rounded-lg bg-blue-900 px-5 py-2.5 text-sm font-bold text-white hover:bg-blue-800">
        Tìm kiếm
      </button>
    </div>

    <div class="ml-auto flex items-center gap-5">
      <!-- Theo dõi đơn -->
      <a href="#" class="flex flex-col items-center text-xs leading-tight text-gray-700 hover:text-blue-900">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
        <span class="mt-1">Theo dõi đơn</span>
      </a>

      <!-- Yêu thích -->
      <a href="#" class="relative flex flex-col items-center text-xs leading-tight text-gray-700 hover:text-blue-900">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="absolute -right-2 -top-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-amber-800 text-[10px] font-bold text-white">{{ wishCount }}</span>
        <span class="mt-1">Yêu thích</span>
      </a>

      <!-- Giỏ hàng -->
      <a href="#" class="relative flex items-center gap-2 rounded-xl bg-indigo-50 px-3 py-2 hover:bg-indigo-100">
        <svg class="h-5 w-5 text-blue-900" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="absolute -left-1.5 -top-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-blue-900 text-[10px] font-bold text-white">{{ cartCount }}</span>
        <span class="leading-tight">
          <span class="block text-[10px] font-bold text-gray-500">GIỎ HÀNG</span>
          <span class="block text-sm font-extrabold text-blue-900">{{ cartTotal }}</span>
        </span>
      </a>

      <span class="hidden h-9 w-px bg-gray-300 sm:block"></span>

      <!-- Đăng nhập -->
      <a href="#" class="flex items-center gap-2 text-xs leading-tight text-gray-700 hover:text-blue-900">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-900 text-white">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </span>
        <span>
          <span class="block text-sm font-bold">Đăng nhập</span>
          <span class="block">Tài khoản</span>
        </span>
      </a>
    </div>
  </div>

  <!-- Menu danh mục -->
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 pb-3 pt-1 text-sm text-gray-700">
    @for (m of menu; track m) {
      <a href="#" class="hover:text-blue-900">{{ m }}</a>
    }
    <a href="#" class="flex items-center gap-1 font-bold text-amber-800">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      Flash Sale
    </a>
    <a href="#" class="hover:text-blue-900">Dịch vụ In Áo</a>

    <span class="ml-auto flex items-center gap-1 text-xs font-medium text-blue-700">
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Đổi size miễn phí trong 30 ngày
    </span>
  </nav>
</header>
